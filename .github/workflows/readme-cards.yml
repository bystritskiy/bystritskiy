name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&count_private=true&include_all_commits=true&show_icons=true&hide_title=true&hide_border=true&theme=transparent
          path: profile/stats.svg
          # GRS_PAT (repo + read:user) enables private contributions; falls back to
          # the built-in token, which only sees public activity.
          token: ${{ secrets.GRS_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&card_width=320&exclude_repo=PolskiBD,bystritskiy.com&size_weight=0.5&count_weight=0.5&hide_border=true&theme=transparent
          path: profile/top-langs.svg
          token: ${{ secrets.GRS_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
